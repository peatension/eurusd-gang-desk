name: CRT Engine

# External cron → workflow_dispatch only (no GitHub schedule overlap)
on:
  workflow_dispatch:

concurrency:
  group: tension-crt
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-crt:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tension-crt

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests pandas numpy

      - name: Run CRT (single engine)
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          TWELVE_DATA_KEYS: ${{ secrets.TWELVE_DATA_KEYS }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHEET_URL: ${{ secrets.SHEET_URL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
        run: python crt_engine.py

      - name: Commit state
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            tension-crt/last_alert_state_crt.json \
            tension-crt/subscribers.json \
            tension-crt/outcomes.json \
            tension-crt/ticket_seq.json \
            tension-crt/telegram_offset.json \
            2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore(crt): persist tension-crt state [skip ci]"
            git push
          fi
