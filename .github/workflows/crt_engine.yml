name: CRT Engine

# GitHub schedule is best-effort (often late on free runners).
# Free Twelve tier: full CRT+3C scan needs \~6–8 min (8s gap × \~40 fetches).
# */5 cancels in-progress runs before they finish → use */10 on GH schedule.
# External cron-job.org: workflow_dispatch every 8–10 min (not 5) until Grow plan.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Cancel only truly stacked runs; 10m cadence lets a healthy scan finish
concurrency:
  group: crt-desk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-crt:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests pandas numpy

      - name: Run CRT + 3C
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHEET_URL: ${{ secrets.SHEET_URL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python desk_runner.py

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            last_alert_state_crt.json \
            last_alert_state_crt_plain.json \
            last_alert_state_crt_set2.json \
            last_alert_state_3c.json \
            last_alert_state_smc.json \
            subscribers.json \
            outcomes.json \
            2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: persist CRT+3C state [skip ci]"
            git push
          fi
