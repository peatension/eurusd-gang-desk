name: CRT Engine

# GitHub schedule is best-effort (often late on free runners).
# Use this file + optional external cron (workflow_dispatch) for real ~5m cadence.
on:
  schedule:
    # Every 5 minutes UTC — GH may delay; external ping covers gaps
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Never stack stale scans: new run cancels the previous one still running
concurrency:
  group: crt-desk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-crt:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests pandas numpy

      - name: Run CRT + 3C
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHEET_URL: ${{ secrets.SHEET_URL }}
        run: python desk_runner.py

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            last_alert_state_crt.json \
            last_alert_state_crt_plain.json \
            last_alert_state_crt_set2.json \
            last_alert_state_3c.json \
            last_alert_state_smc.json \
            subscribers.json \
            outcomes.json \
            2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: persist CRT+3C state [skip ci]"
            git push
          fi
