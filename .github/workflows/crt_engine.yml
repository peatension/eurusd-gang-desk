name: CRT Engine

# ONLY external cron-job.org → workflow_dispatch every 10 min.
# No GitHub schedule (overlapping runners caused /start spam).
on:
  workflow_dispatch:

# CRITICAL: do NOT cancel in-progress runs.
# cancel-in-progress: true was killing jobs before Commit state,
# so locks/pending never reached GitHub → duplicates every cron.
concurrency:
  group: crt-desk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-crt:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests pandas numpy

      - name: Run CRT + 3C
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          TWELVE_DATA_KEYS: ${{ secrets.TWELVE_DATA_KEYS }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHEET_URL: ${{ secrets.SHEET_URL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          DISABLE_COMMAND_POLLING: "1"
        run: python desk_runner.py

      # Always attempt persistence, even if the scan step fails.
      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for f in \
            last_alert_state_crt.json \
            last_alert_state_crt_plain.json \
            last_alert_state_crt_set2.json \
            last_alert_state_3c.json \
            last_alert_state_smc.json \
            subscribers.json \
            outcomes.json \
            published_setups.json \
            telegram_offset.json \
            ticket_seq.json; do
            if [ -f "$f" ]; then
              git add -f -- "$f"
            fi
          done

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: persist CRT+3C state [skip ci]"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
