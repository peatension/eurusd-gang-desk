name: BET SQUAD Daily Scan

on:
  schedule:
    - cron: "0 8 * * *" # 09:00 Africa/Lagos
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run data scan
        env:
          BET_API: ${{ secrets.BET_API }}
          BET_DB_PATH: /tmp/bet_squad.sqlite3
          BET_MIN_EDGE: "0.04"
          BET_MAX_SELECTIONS: "10"
        run: python bet_squad_bot.py --scan
