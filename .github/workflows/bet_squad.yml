
name: BET SQUAD Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *" # 09:00 WAT

permissions:
  contents: read

concurrency:
  group: bet-squad-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bet_squad/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r bet_squad/requirements.txt

      - name: Run BET SQUAD scan
        env:
          BET_API: ${{ secrets.BET_API }}
          BET_BOOKMAKER_ID: "7"
          BET_BOOKMAKER_NAME: "William Hill"
        run: python bet_squad/bet_squad_bot.py --scan
