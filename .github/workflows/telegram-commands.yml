name: Telegram Commands

# Fast path for /start /help /performance /admin /risk and inline buttons.
# Trigger from cron-job.org every 1–2 minutes (separate from CRT Engine).
# Does NOT run market scan — commands only.
on:
  workflow_dispatch:

concurrency:
  group: telegram-commands
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cmds:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install
        run: pip install requests pandas numpy

      - name: Process Telegram commands
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          TWELVE_DATA_KEYS: ${{ secrets.TWELVE_DATA_KEYS }}
        run: python telegram_cmd_runner.py

      - name: Commit command state (tension-crt only)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            tension-crt/telegram_offset.json \
            tension-crt/subscribers.json \
            tension-crt/last_alert_state_crt.json \
            tension-crt/ticket_seq.json \
            tension-crt/outcomes.json \
            2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No command-state changes."
          else
            git commit -m "chore: persist telegram command state [skip ci]"
            git push
          fi
