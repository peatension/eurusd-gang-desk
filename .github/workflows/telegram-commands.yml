name: Telegram Commands

# Trigger only from cron-job.org via workflow_dispatch every 1–2 minutes.
on:
  workflow_dispatch:

# Separate from the market scan: command polling is disabled in CRT Engine.
concurrency:
  group: telegram-commands
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  commands:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pandas numpy
      - name: Process Telegram commands only
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          TWELVE_DATA_KEYS: ${{ secrets.TWELVE_DATA_KEYS }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHEET_URL: ${{ secrets.SHEET_URL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
        run: python telegram_cmd_runner.py
      - name: Commit command state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in subscribers.json telegram_offset.json telegram_command_state.json; do
            if [ -f "$f" ]; then git add -f -- "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No command state changes to commit."
          else
            git commit -m "chore: persist Telegram command state [skip ci]"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
